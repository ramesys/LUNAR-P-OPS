[project]
name = "clps-api"
version = "0.1.0"
description = "HTTP API exposing lunar_core computations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "lunar-core",
    "uvicorn[standard]>=0.34",
]

[tool.uv.sources]
lunar-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
