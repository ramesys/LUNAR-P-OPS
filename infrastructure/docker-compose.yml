# Development stack: `docker compose up --build` from the repository root (see ../compose.yaml).
# Paths are relative to this file.
name: clps-lunar-mission-browser

x-api-build: &api-build
  context: ../backend
  dockerfile: ../infrastructure/docker/api.Dockerfile
  target: dev

services:
  # One-shot: downloads SPICE kernels (required), LOLA terrain and the pole map relief (optional).
  data:
    image: clps-lunar-mission-browser-api:dev
    build: *api-build
    command:
      - sh
      - -c
      - >-
        clps-fetch-kernels
        && (clps-fetch-terrain || echo "WARNING - terrain download failed; flat horizon will be used")
        && (clps-fetch-basemap || echo "WARNING - basemap download failed; map shown without relief")
    volumes:
      - ../data:/data
    restart: "no"

  api:
    image: clps-lunar-mission-browser-api:dev
    build: *api-build
    ports:
      - "8000:8000"
    environment:
      # Optional: recorded in new evaluations' provenance, e.g.
      # CLPS_GIT_COMMIT=$(git rev-parse HEAD) docker compose up -d api
      CLPS_GIT_COMMIT: ${CLPS_GIT_COMMIT:-}
    volumes:
      - ../data:/data
    depends_on:
      data:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ../backend/api/src
          target: /workspace/api/src
        - action: sync
          path: ../backend/lunar-core/src
          target: /workspace/lunar-core/src
        - action: rebuild
          path: ../backend/uv.lock

  web:
    image: clps-lunar-mission-browser-web:dev
    build:
      context: ../frontend
      dockerfile: ../infrastructure/docker/web.Dockerfile
      target: dev
    ports:
      - "5180:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    develop:
      watch:
        - action: sync
          path: ../frontend/web/src
          target: /workspace/web/src
        - action: sync
          path: ../frontend/api-client/src
          target: /workspace/api-client/src
        - action: rebuild
          path: ../frontend/pnpm-lock.yaml
